<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人导航 · 我的主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="toolbar">
    <div class="editbar" id="editBar" hidden>
      <button class="btn primary" id="saveBtn" type="button">保存更改</button>
      <button class="btn" id="cancelBtn" type="button">取消</button>
      <button class="btn" id="resetBtn" type="button">恢复默认</button>
    </div>
    <div class="wp-wrap" id="wpWrap">
      <button class="btn" id="wpBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        壁纸
      </button>
      <div class="wp-panel" id="wpPanel" hidden></div>
    </div>
    <button class="btn" id="editBtn" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      编辑
    </button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <div class="hint" id="editHint" hidden>编辑模式：改好某个分组后可点它的“保存本组”，或点“保存更改”保存全部；编辑其他分组不会影响本组未保存的内容。</div>

  <header class="hero">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <div class="greet" id="greet">你好，欢迎回来</div>

    <form class="search" id="searchForm">
      <span class="s-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </span>
      <input id="q" type="text" placeholder="输入关键词搜索…" autocomplete="off">
      <select id="engine" title="选择搜索引擎">
        <option value="bing">必应</option>
        <option value="baidu">百度</option>
        <option value="google">谷歌</option>
        <option value="github">GitHub</option>
      </select>
      <button type="submit">搜索</button>
    </form>
  </header>

  <main class="grid" id="grid"></main>

  <footer>个人导航 · 点击右上角“编辑”可自由增删分组与链接 · <a href="#" id="reset">回到顶部</a></footer>
</div>

<script src="script.js"></script>
</body>
</html>
